name: "Sincronització Bot Telegram (Drenatge periòdic)"

on:
  schedule:
    # S'executa cada 20 minuts per processar missatges si no tens un servidor local encès
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drain-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 💬 Processar missatges pendents de Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py --drain

      - name: 💾 Persistir estat de la base de dades
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/data.db
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: actualització llista de seguiment bot [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "Sense canvis en els seguiments."
          fi
