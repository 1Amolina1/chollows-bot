name: "Report Matinal Chollows (07:00 CET/CEST)"

on:
  schedule:
    # S'executa a les 05:00 UTC (07:00 CEST a l'estiu) i a les 06:00 UTC (07:00 CET a l'hivern).
    # L'script watch.py comprova la zona horària local (Europe/Madrid) i només s'executa quan són les 07:xx.
    - cron: '0 5,6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar generació del report ara mateix (ignora la comprovació de les 07:00)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositori
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛒 Executar cerca de cholls i notícies
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python watch.py --force
          else
            python watch.py
          fi

      - name: 💾 Persistir estat de la base de dades (git commit & push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/data.db
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: persistència de base de dades post-report [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "Sense canvis a la base de dades."
          fi
